    # --- control api: life uploads ---------------------------------------------
    # Include inside the example.com server block, next to nginx/control.location.conf. Not applied by the repo; the owner
    # applies it at Z4 (nginx -t, reload) and then sets CONTROL_LIFE_UPLOADS=1 for Tokyo. Until then the manifest says uploads:false
    # and the gateway answers 503 for both paths.
    #
    # Exactly two public paths get the larger body limit and the longer read timeout; every other path under /control/api/v1/ keeps
    # the 64k and 40s of control.location.conf. They are longer prefixes than /control/api/v1/ (^~), so they win even when that one is ^~.
    # The gateway enforces the dashboard's own caps (content video: CONTENT_UPLOAD_MAX_MB, transcript audio: 25 MB); 30m is the outer limit.
    #   POST /control/api/v1/life/api/transcripts/upload
    #   POST /control/api/v1/life/api/content/items/<id>/upload
    # Same headers as the Control location: X-Real-IP is overwritten (Tokyo trusts it from a loopback peer only), never appended.
    location ^~ /control/api/v1/life/api/transcripts/upload {
        limit_req zone=control burst=10 nodelay;
        rewrite ^/control/api/v1/(.*)$ /control-api/v1/$1 break;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }
    # The id is in the middle of the path, so the exact match is a regex nested in the content/items prefix; its siblings keep 64k and 40s.
    location ^~ /control/api/v1/life/api/content/items/ {
        limit_req zone=control burst=10 nodelay;
        rewrite ^/control/api/v1/(.*)$ /control-api/v1/$1 break;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        client_max_body_size 64k;

        location ~ ^/control/api/v1/life/api/content/items/[0-9]+/upload$ {
            limit_req zone=control burst=10 nodelay;
            rewrite ^/control/api/v1/(.*)$ /control-api/v1/$1 break;
            proxy_pass http://127.0.0.1:3030;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 30m;
        }
    }
    # --- end control api: life uploads -----------------------------------------
