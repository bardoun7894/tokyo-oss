# ntfy for the Control app push. Install as /etc/nginx/sites-available/ntfy.conf (Z0 only).
# The TLS block sits between the BEGIN-TLS and END-TLS markers: README step 2 installs the
# file without it (certificate does not exist yet), step 4 installs it whole.
server {
    listen 80;
    listen [::]:80;
    server_name ntfy.203-0-113-10.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
# BEGIN-TLS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ntfy.203-0-113-10.sslip.io;

    ssl_certificate /etc/letsencrypt/live/ntfy.203-0-113-10.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntfy.203-0-113-10.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3m;
        proxy_send_timeout 3m;
    }
}
# END-TLS
